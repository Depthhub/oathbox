# Builds the Oathbox container from the Dockerfile and pushes it to GitHub's registry:
#   ghcr.io/depthhub/oathbox:latest  and  ghcr.io/depthhub/oathbox:<commit>
# Azure Container Apps pulls it from there.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # image names must be lowercase (the owner is "Depthhub")
          tags: |
            ghcr.io/depthhub/oathbox:latest
            ghcr.io/depthhub/oathbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
