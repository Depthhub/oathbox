[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oathbox"
version = "0.1.0"
description = "Private due diligence: TEE-answered questions over a data room committed on NEAR."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "eth-account>=0.11",
    "dcap-qvl>=0.3.2",
    "near-kit",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["oathbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
